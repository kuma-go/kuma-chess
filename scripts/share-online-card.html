<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #fff7dc;
        background: #1c150f;
        font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 68%; }
      .shade { position: absolute; inset: 0; background: rgba(21, 13, 8, .33); }
      .frame { position: absolute; inset: 20px; border: 3px solid #d5a54a; box-shadow: inset 0 0 0 2px rgba(255, 239, 182, .55), 0 0 0 8px rgba(31, 20, 12, .62); }
      .brand {
        position: absolute;
        top: 38px;
        left: 50px;
        width: 326px;
        height: auto;
        filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .7));
      }
      .label {
        position: absolute;
        top: 54px;
        right: 50px;
        padding: 13px 24px 12px;
        border: 2px solid #e7bd67;
        color: #fff1be;
        background: rgba(45, 29, 17, .88);
        font-size: 24px;
        font-weight: 800;
      }
      .message {
        position: absolute;
        right: 50px;
        bottom: 42px;
        left: 50px;
        padding: 22px 30px 24px;
        border: 2px solid rgba(234, 190, 103, .82);
        background: rgba(42, 27, 17, .9);
        box-shadow: 0 7px 18px rgba(0, 0, 0, .34);
        text-align: center;
      }
      h1 { margin: 0; font-size: 43px; line-height: 1.15; letter-spacing: 0; }
      p { margin: 8px 0 0; color: #f2d79d; font-size: 23px; font-weight: 700; line-height: 1.3; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <img class="scene" src="../assets/kuma/web/main_img_B.png" alt="" />
    <div class="shade"></div>
    <div class="frame"></div>
    <img class="brand" src="../assets/kuma/web/main_logo_B.png" alt="KUMA CHESS" />
    <div class="label">ONLINE PLAY</div>
    <div class="message">
      <h1>친구가 온라인 대전에 초대했어요</h1>
      <p>초대 링크를 열고 왕국의 체스판에서 만나요</p>
    </div>
  </body>
</html>
